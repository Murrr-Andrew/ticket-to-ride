<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ticket to Ride Europe — карта</title>
  <meta name="theme-color" content="#2b2118">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app">
    <div id="map-wrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="banner" hidden></div>
      <div id="ticket-hint" hidden></div>
      <div id="fab">
        <button id="menu-btn" aria-label="Меню"></button>
        <button id="undo-btn" aria-label="Отменить последний ход">↶</button>
      </div>
    </div>
  </main>
  <div id="drawer-backdrop" hidden></div>
  <aside id="panel" aria-hidden="true"></aside>
  <div id="rotate-hint">Поверните телефон — карта станет больше</div>
  <div id="popup" hidden></div>
  <div id="overlay" hidden></div>
  <div id="dialog" hidden></div>
  <div id="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
